<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Champions Elite: Playoff & Tournament Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;900&display=swap');
        
        :root { --accent: #fbbf24; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #020617; 
            font-family: 'Inter', sans-serif; color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-wrapper {
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            position: relative;
        }

        #game-container {
            position: relative;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }

        canvas { 
            display: block;
            background: linear-gradient(to bottom, #020617 0%, #1e1b4b 70%, #064e3b 100%);
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
        }

        .bungee { font-family: 'Bungee', cursive; }

        .ui-overlay { 
            position: absolute; inset: 0; 
            pointer-events: none; z-index: 100;
            display: flex; justify-content: center; align-items: center;
            background: rgba(2, 6, 23, 0.4);
            backdrop-filter: blur(4px);
        }

        .menu-card { 
            pointer-events: auto; 
            background: rgba(15, 23, 42, 0.95); 
            padding: 2rem; border-radius: 1.5rem; 
            border: 1px solid rgba(251, 191, 36, 0.3); 
            text-align: center; width: 95%; max-width: 1100px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .bracket-match { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 0.75rem; padding: 0.75rem; 
            margin-bottom: 0.5rem; font-size: 0.75rem; 
            cursor: pointer; transition: all 0.2s ease;
            min-width: 160px;
        }
        .bracket-match:hover { border-color: var(--accent); background: rgba(251, 191, 36, 0.1); }
        .bracket-match.active { border-color: var(--accent); background: rgba(251, 191, 36, 0.2); transform: scale(1.02); }
        
        .winner-text { color: var(--accent); font-weight: 900; }

        .goal-popup { 
            position: absolute; top: 40%; left: 50%; 
            transform: translate(-50%, -50%) scale(0); 
            font-size: clamp(3rem, 10vw, 8rem); color: var(--accent); 
            text-shadow: 0 8px 0 #92400e; pointer-events: none; 
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 200; 
        }
        .goal-active { transform: translate(-50%, -50%) scale(1); }

        .spinner {
            width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: #fff;
            animation: spin 1s ease-in-out infinite; display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .touch-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            active-background: rgba(251, 191, 36, 0.4);
            touch-action: manipulation;
        }
        .touch-btn:active {
            background: rgba(251, 191, 36, 0.3);
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <div id="goal-text" class="goal-popup bungee">GOAL!</div>
            <div id="nickname-overlay" class="ui-overlay">
                <div class="menu-card max-w-md">
                    <h1 class="text-4xl bungee mb-2 tracking-tight">STRIKER ELITE</h1>
                    <p class="text-yellow-500 font-bold mb-6 text-sm">PRO TOURNAMENT & PLAYOFFS</p>
                    <div class="space-y-4">
                        <input id="user-nick" type="text" maxlength="12" class="w-full p-4 bg-white/5 border border-white/20 rounded-xl text-center text-xl bungee uppercase focus:border-yellow-500 outline-none transition-colors" placeholder="ENTER NICKNAME">
                        <button id="join-btn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 py-4 bungee text-xl rounded-xl transition-all flex items-center justify-center gap-3">
                            <span>PLAY NOW</span>
                            <div id="join-spinner" class="spinner"></div>
                        </button>
                    </div>
                </div>
            </div>

            <div id="tournament-menu" class="ui-overlay hidden">
                <div class="menu-card overflow-hidden flex flex-col max-h-[95vh]">
                    <div class="flex flex-wrap justify-between items-center mb-4 gap-4">
                        <div class="text-left">
                            <h1 class="text-3xl bungee text-white italic leading-none">WORLD TOURNAMENT</h1>
                            <p id="my-nick-display" class="text-yellow-500 bungee text-xs mt-1 opacity-80"></p>
                        </div>
                        <div class="text-right text-[10px] opacity-60 uppercase font-bold text-yellow-500 bg-white/5 px-3 py-1.5 rounded-full border border-white/10">
                            Playoffs &gt; R16 &gt; QF &gt; SF &gt; Final
                        </div>
                    </div>
                    <div class="overflow-x-auto w-full mb-4 pb-2 border border-white/5 rounded-xl bg-slate-950/40 p-3">
                        <div id="bracket-ui" class="grid grid-cols-5 gap-4 text-left min-w-[950px]">
                            <div class="flex flex-col justify-around gap-2" id="round-playoffs"></div>
                            <div class="flex flex-col justify-around gap-2" id="round-r16"></div>
                            <div class="flex flex-col justify-around gap-2" id="round-qf"></div>
                            <div class="flex flex-col justify-around gap-2" id="round-sf"></div>
                            <div class="flex flex-col justify-around gap-2" id="round-final"></div>
                        </div>
                    </div>

                    <div id="match-preview" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-300 p-4 bg-white/5 rounded-xl border border-white/10">
                        <div class="flex justify-around items-center">
                            <div class="flex flex-col items-center gap-2">
                                <img id="prev-p1-logo" class="w-14 h-14 object-contain" src="" onerror="this.style.display='none'">
                                <span id="prev-p1-name" class="bungee text-xs text-center max-w-[120px] truncate">TEAM A</span>
                            </div>
                            <div class="text-center">
                                <div class="text-3xl bungee text-yellow-500" id="match-duration-display">30s</div>
                                <div class="text-[10px] bungee opacity-40">MATCH LENGTH</div>
                            </div>
                            <div class="flex flex-col items-center gap-2">
                                <img id="prev-p2-logo" class="w-14 h-14 object-contain" src="" onerror="this.style.display='none'">
                                <span id="prev-p2-name" class="bungee text-xs text-center max-w-[120px] truncate">TEAM B</span>
                            </div>
                        </div>
                        <button id="kickoff-btn" class="mt-4 w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 py-3 bungee text-lg rounded-xl transition-all">START MATCH</button>
                    </div>
                </div>
            </div>

            <div id="hud" class="absolute top-8 left-0 w-full flex justify-center items-start pointer-events-none opacity-0 transition-opacity duration-500">
                <div id="hud-bg" class="flex items-center gap-8 bg-slate-900/90 px-8 py-3 rounded-full backdrop-blur-md border border-white/10 shadow-2xl">
                    <div class="flex items-center gap-3">
                        <img id="hud-p1-logo" class="w-10 h-10 object-contain" src="" onerror="this.style.display='none'">
                        <div id="hud-p1-score" class="text-4xl bungee leading-none">0</div>
                    </div>
                    <div class="flex flex-col items-center min-w-[100px]">
                        <div id="timer" class="text-3xl bungee text-yellow-400">00:30</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div id="hud-p2-score" class="text-4xl bungee leading-none">0</div>
                        <img id="hud-p2-logo" class="w-10 h-10 object-contain" src="" onerror="this.style.display='none'">
                    </div>
                </div>
            </div>


            <div id="mobile-controls" class="absolute bottom-6 left-0 right-0 px-6 flex justify-between pointer-events-none opacity-0 transition-opacity duration-500 z-50">

                <div class="flex gap-4 pointer-events-auto">
                    <button id="touch-left" class="touch-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl font-bold">←</button>
                    <button id="touch-right" class="touch-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl font-bold">→</button>
                </div>

                <div class="flex gap-4 pointer-events-auto">
                    <button id="touch-sub" class="touch-btn w-16 h-16 rounded-full flex flex-col items-center justify-center text-xs font-bold font-sans">
                        <span>SUB</span>
                        <span class="text-[9px] text-yellow-400">TAP S</span>
                    </button>
                    <button id="touch-up" class="touch-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl font-bold">↑</button>
                </div>
            </div>

            <div id="result-menu" class="ui-overlay hidden">
                <div class="menu-card max-w-md">
                    <h2 class="text-3xl bungee mb-2 text-white/60">MATCH RESULT</h2>
                    <div id="winner-display" class="text-4xl bungee text-yellow-400 mb-8">-</div>
                    <button id="back-to-bracket" class="bg-white hover:bg-slate-100 text-slate-950 w-full py-4 bungee text-xl rounded-xl transition-all">RETURN TO HUB</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WIDTH = 1200, HEIGHT = 700, GROUND_Y = 640;
        const GRAVITY = 0.55, BALL_BOUNCE = 0.85, FRICTION = 0.98;
        const GOAL_WIDTH = 80, GOAL_HEIGHT = 200;
        
        // Match lengths for each progressive phase of the tournament
        const ROUND_TIMES = { playoffs: 30, r16: 45, qf: 60, sf: 75, final: 90 };

        // 8 elite direct round of 16 qualifiers
        const eliteTeams = [
            { id: 'ars', name: 'Arsenal', color: '#EF0107', logo: 'https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg', players: [{name: 'Saka', num: 7}, {name: 'Gabriel', num: 6}, {name: 'Saliba', num: 2}, {name: 'Rice', num: 41}, {name: 'Zubimendi', num: 36}, {name: 'Timber', num: 12}, {name: 'Ødegaard', num: 8}, {name: 'Gyokeres', num: 14}, {name: 'Merino', num: 23}, {name: 'Trossard', num: 19}, {name: 'Raya', num: 1}] },
            { id: 'bay', name: 'Bayern Munich', color: '#DC052D', logo: 'https://upload.wikimedia.org/wikipedia/commons/1/1b/FC_Bayern_M%C3%BCnchen_logo_%282017%29.svg', players: [{name: 'Kane', num: 9}, {name: 'Olise', num: 17}, {name: 'Díaz', num: 14}, {name: 'Musiala', num: 10}, {name: 'Kimmich', num: 6}, {name: 'Kim', num: 3}, {name: 'Tah', num: 4}, {name: 'Upamecano', num: 2}, {name: 'Laimer', num: 27}, {name: 'Davies', num: 19}, {name: 'Neuer', num: 1}] },
            { id: 'bar', name: 'Barcelona', color: '#004D98', logo: 'https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona.svg', players: [{name: 'Pedri', num: 8}, {name: 'Yamal', num: 10}, {name: 'Raphinha', num: 11}, {name: 'de Jong', num: 21}, {name: 'Cubarsi', num: 5}, {name: 'Gavi', num: 6}, {name: 'Olmo', num: 20}, {name: 'Kounde', num: 23}, {name: 'Rashford', num: 14}, {name: 'Lewandowski', num: 9}, {name: 'Garcia', num: 13}] },
            { id: 'psg', name: 'Paris SG', color: '#004170', logo: 'https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg', players: [{name: 'Dembele', num: 10}, {name: 'Hakimi', num: 2}, {name: 'Vitinha', num: 17}, {name: 'Barcola', num: 29}, {name: 'Zaïre Emery', num: 33}, {name: 'Kvaraskhelia', num: 7}, {name: 'Marquinhos', num: 5}, {name: 'Neves', num: 87}, {name: 'Mendes', num: 25}, {name: 'Lee', num: 19}, {name: 'Doue', num: 14}] },
            { id: 'rma', name: 'Real Madrid', color: '#FFFFFF', logo: 'https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg', players: [{name: 'Mbappe', num: 9}, {name: 'Vini Jr', num: 7}, {name: 'Bellingham', num: 5}, {name: 'Valverde', num: 8}, {name: 'Rudiger', num: 22}, {name: 'Tchouameni', num: 14}, {name: 'Rodrygo', num: 11}, {name: 'Camavinga', num: 6}, {name: 'Alexander-Arnold', num: 12}, {name: 'Militao', num: 3}, {name: 'Courtois', num: 1}] },
            { id: 'mci', name: 'Man City', color: '#6CABDD', logo: 'https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg', players: [{name: 'Haaland', num: 9}, {name: 'Rodri', num: 16}, {name: 'Bernardo', num: 20}, {name: 'Foden', num: 47}, {name: 'Nunes', num: 27}, {name: 'Doku', num: 11}, {name: 'Dias', num: 3}, {name: 'Gvardiol', num: 24}, {name: 'Cherki', num: 10}, {name: 'Rayan', num: 21}, {name: 'Donnarumma', num: 25}] },
            { id: 'liv', name: 'Liverpool', color: '#C8102E', logo: 'https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg', players: [{name: 'Van Dijk', num: 4}, {name: 'Wirtz', num: 7}, {name: 'Salah', num: 11}, {name: 'Konate', num: 5}, {name: 'Szobozlai', num: 8}, {name: 'Gravenberch', num: 38}, {name: 'Mac Allister', num: 10}, {name: 'Ekitike', num: 22}, {name: 'Gakpo', num: 18}, {name: 'Isak', num: 9}, {name: 'Marmardashvili', num: 25}] },
            { id: 'int', name: 'Inter Milan', color: '#0062AD', logo: 'https://upload.wikimedia.org/wikipedia/commons/0/05/FC_Internazionale_Milano_2021.svg', players: [{name: 'Çalhanoglu', num: 20}, {name: 'Dimarco', num: 22}, {name: 'Martinez', num: 10}, {name: 'Barella', num: 23}, {name: 'Bastoni', num: 95}, {name: 'Thuram', num: 9}, {name: 'Akanji', num: 25}, {name: 'Zielinski', num: 7}, {name: 'Pavard', num: 5}, {name: 'Mkhitaryan', num: 22}, {name: 'Sommer', num: 1}] }
        ];

        const playoffTeams = [
            { id: 'mun', name: 'Man United', color: '#DA291C', logo: 'https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg', players: [{name: 'Bruno F.', num: 8}, {name: 'Rashford', num: 10}] },
            { id: 'dor', name: 'Dortmund', color: '#FDE100', logo: 'https://upload.wikimedia.org/wikipedia/commons/6/67/Borussia_Dortmund_logo.svg', players: [{name: 'Brandt', num: 10}, {name: 'Guirassy', num: 9}] },
            { id: 'scp', name: 'Sporting CP', color: '#00805C', logo: 'https://upload.wikimedia.org/wikipedia/en/e/e1/Sporting_CP.svg', players: [{name: 'Gyökeres', num: 9}, {name: 'Hjulmand', num: 42}] },
            { id: 'nap', name: 'Napoli', color: '#003D7E', logo: 'https://upload.wikimedia.org/wikipedia/commons/2/2d/SSC_Napoli_2021.svg', players: [{name: 'Kvara', num: 7}, {name: 'Lukaku', num: 11}] },
            { id: 'juv', name: 'Juventus', color: '#000000', logo: 'https://upload.wikimedia.org/wikipedia/commons/b/bc/Juventus_FC_2017_icon_%28black%29.svg', players: [{name: 'Vlahovic', num: 9}, {name: 'Yildiz', num: 10}] },
            { id: 'fla', name: 'Flamengo', color: '#C4122E', logo: 'https://upload.wikimedia.org/wikipedia/commons/2/2e/Flamengo_brazilian_crest.svg', players: [{name: 'Pedro', num: 9}, {name: 'Arrascaeta', num: 14}] },
            { id: 'bou', name: 'Bournemouth', color: '#B50E12', logo: 'https://upload.wikimedia.org/wikipedia/en/e/e5/AFC_Bournemouth_%282013%29.svg', players: [{name: 'Semenyo', num: 24}, {name: 'Kluivert', num: 19}] },
            { id: 'avl', name: 'Aston Villa', color: '#95BFE5', logo: 'https://upload.wikimedia.org/wikipedia/en/9/9f/Aston_Villa_logo.svg', players: [{name: 'Watkins', num: 11}, {name: 'Bailey', num: 31}] },
            { id: 'ben', name: 'Benfica', color: '#E10000', logo: 'https://upload.wikimedia.org/wikipedia/en/a/a2/SL_Benfica_logo.svg', players: [{name: 'Di Maria', num: 11}, {name: 'Pavlidis', num: 14}] },
            { id: 'lev', name: 'Leverkusen', color: '#E32219', logo: 'https://upload.wikimedia.org/wikipedia/en/5/59/Bayer_04_Leverkusen_logo.svg', players: [{name: 'Wirtz', num: 10}, {name: 'Grimaldo', num: 20}] },
            { id: 'rom', name: 'AS Roma', color: '#8E1D31', logo: 'https://upload.wikimedia.org/wikipedia/en/f/f7/AS_Roma_logo_%282017%29.svg', players: [{name: 'Dybala', num: 21}, {name: 'Pellegrini', num: 7}] },
            { id: 'atm', name: 'Atleti', color: '#CB3524', logo: 'https://upload.wikimedia.org/wikipedia/en/f/f4/Atletico_Madrid_2017_logo.svg', players: [{name: 'Griezmann', num: 7}, {name: 'Alvarez', num: 19}] },
            { id: 'bha', name: 'Brighton', color: '#0057B8', logo: 'https://upload.wikimedia.org/wikipedia/en/f/fd/Brighton_%26_Hove_Albion_logo.svg', players: [{name: 'Pedro', num: 9}, {name: 'Mitoma', num: 22}] },
            { id: 'psv', name: 'PSV Eindhoven', color: '#E21A1A', logo: 'https://upload.wikimedia.org/wikipedia/en/0/05/PSV_Eindhoven.svg', players: [{name: 'L. de Jong', num: 9}, {name: 'Bakayoko', num: 11}] },
            { id: 'com', name: 'Como 1907', color: '#1F355E', logo: 'https://upload.wikimedia.org/wikipedia/commons/e/ea/Como_1907_logo.png', players: [{name: 'Cutrone', num: 10}, {name: 'Belotti', num: 11}] },
            { id: 'pal', name: 'Palmeiras', color: '#006437', logo: 'https://upload.wikimedia.org/wikipedia/commons/1/10/Palmeiras_logo.svg', players: [{name: 'Veiga', num: 20}, {name: 'Estêvão', num: 41}] }
        ];

        let bracket = { playoffs: [], r16: [], qf: [], sf: [], final: [] };
        let activeMatch = null, nickname = "";
        let p1Team, p2Team, p1ActiveIdx = 0, p2ActiveIdx = 0;
        let score = [0, 0], gameTime = 30, gameRunning = false, isGameOver = false, isGoalScored = false;
        const keys = {};

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            const scale = Math.min(winW / WIDTH, winH / HEIGHT);
            canvas.style.width = (WIDTH * scale) + 'px';
            canvas.style.height = (HEIGHT * scale) + 'px';
            canvas.width = WIDTH;
            canvas.height = HEIGHT;
        }
        window.onresize = resizeCanvas;
        resizeCanvas();

        class Ball {
            constructor() { this.radius = 18; this.reset(); }
            reset() { this.x = WIDTH / 2; this.y = HEIGHT / 2 - 100; this.vx = 0; this.vy = 0; isGoalScored = false; }
            update() {
                if(isGoalScored) return;
                this.vy += GRAVITY * 0.75;
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.996;
                if (this.y + this.radius > GROUND_Y) { this.y = GROUND_Y - this.radius; this.vy *= -BALL_BOUNCE; this.vx *= FRICTION; }
                if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -BALL_BOUNCE; }
                if (this.x + this.radius > WIDTH) { this.x = WIDTH - this.radius; this.vx *= -BALL_BOUNCE; }
                if (this.y > GROUND_Y - GOAL_HEIGHT) {
                    if (this.x < GOAL_WIDTH) { if (this.vx < 0) handleGoal(1); else { this.x = GOAL_WIDTH + this.radius; this.vx = Math.abs(this.vx) * BALL_BOUNCE; } }
                    if (this.x > WIDTH - GOAL_WIDTH) { if (this.vx > 0) handleGoal(0); else { this.x = WIDTH - GOAL_WIDTH - this.radius; this.vx = -Math.abs(this.vx) * BALL_BOUNCE; } }
                }
                const barY = GROUND_Y - GOAL_HEIGHT;
                if ((this.x < GOAL_WIDTH || this.x > WIDTH - GOAL_WIDTH) && Math.abs(this.y - barY) < this.radius) {
                    if (this.vy > 0) { this.y = barY - this.radius; this.vy *= -BALL_BOUNCE; }
                }
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.x / 18);
                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#000'; ctx.stroke();
                ctx.fillStyle = '#0f172a';
                for(let i=0; i<5; i++) { ctx.rotate((Math.PI*2)/5); ctx.beginPath(); ctx.moveTo(0, -this.radius); ctx.lineTo(5, -6); ctx.lineTo(-5, -6); ctx.fill(); }
                ctx.restore();
            }
        }

        class Player {
            constructor(x, isP1) {
                this.startX = x; this.x = x; this.y = GROUND_Y - 45;
                this.vx = 0; this.vy = 0; this.isP1 = isP1;
                this.radius = 45; this.jumpPower = -15; this.speed = 8;
                this.logo = new Image(); this.logoLoaded = false;
                this.logo.onload = () => this.logoLoaded = true;
            }
            reset() { this.x = this.startX; this.y = GROUND_Y - this.radius; this.vx = 0; this.vy = 0; }
            update() {
                if (isGoalScored) return;
                const left = this.isP1 ? 'KeyA' : 'ArrowLeft';
                const right = this.isP1 ? 'KeyD' : 'ArrowRight';
                const up = this.isP1 ? 'KeyW' : 'ArrowUp';
                const sub = this.isP1 ? 'KeyS' : 'ArrowDown';

                if (keys[left]) this.vx = -this.speed;
                else if (keys[right]) this.vx = this.speed; else this.vx = 0;
                if (keys[up] && this.y + this.radius >= GROUND_Y) this.vy = this.jumpPower;
                if (keys[sub]) this.substitute();

                this.vy += GRAVITY; this.x += this.vx; this.y += this.vy;
                if (this.isP1 && this.x - this.radius < GOAL_WIDTH) this.x = GOAL_WIDTH + this.radius;
                if (!this.isP1 && this.x + this.radius > WIDTH - GOAL_WIDTH) this.x = WIDTH - GOAL_WIDTH - this.radius;
                if (this.x - this.radius < 0) this.x = this.radius;
                if (this.x + this.radius > WIDTH) this.x = WIDTH - this.radius;
                if (this.y + this.radius > GROUND_Y) { this.y = GROUND_Y - this.radius; this.vy = 0; }
            }
            substitute() {
                const key = 'subLock' + this.isP1;
                if (keys[key]) return;
                keys[key] = true;
                setTimeout(() => delete keys[key], 600);
                if (this.isP1) p1ActiveIdx = (p1ActiveIdx + 1) % p1Team.players.length;
                else p2ActiveIdx = (p2ActiveIdx + 1) % p2Team.players.length;
            }
            draw() {
                const team = this.isP1 ? p1Team : p2Team;
                const player = team.players[this.isP1 ? p1ActiveIdx : p2ActiveIdx];
                if (this.logo.src !== team.logo) { this.logo.src = team.logo; this.logoLoaded = false; }
                
                ctx.beginPath(); ctx.ellipse(this.x, GROUND_Y, this.radius * 0.8, 8, 0, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
                
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = team.color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.stroke();
                
                if (this.logoLoaded) {
                    ctx.save(); ctx.beginPath(); ctx.arc(this.x, this.y, this.radius - 4, 0, Math.PI*2); ctx.clip();
                    ctx.drawImage(this.logo, this.x - 35, this.y - 35, 70, 70);
                    ctx.restore();
                }
                ctx.fillStyle = '#fff'; ctx.font = '900 13px Inter'; ctx.textAlign = 'center';
                ctx.fillText(`${player.name.toUpperCase()} ${player.num}`, this.x, this.y - this.radius - 18);
            }
        }

        const ball = new Ball(), p1 = new Player(250, true), p2 = new Player(950, false);

        function handleGoal(scorer) {
            if (isGoalScored) return;
            isGoalScored = true; score[scorer]++;
            document.getElementById('goal-text').classList.add('goal-active');
            document.getElementById('hud-p1-score').innerText = score[0];
            document.getElementById('hud-p2-score').innerText = score[1];
            setTimeout(() => {
                document.getElementById('goal-text').classList.remove('goal-active');
                ball.reset(); p1.reset(); p2.reset();
            }, 1500);
        }

        function mainLoop() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(WIDTH/2, GROUND_Y); ctx.lineTo(WIDTH/2, 100); ctx.stroke();
            ctx.beginPath(); ctx.arc(WIDTH/2, GROUND_Y - 200, 60, 0, Math.PI*2); ctx.stroke();
            
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 8;
            ctx.strokeRect(-5, GROUND_Y - GOAL_HEIGHT, GOAL_WIDTH + 5, GOAL_HEIGHT);
            ctx.strokeRect(WIDTH - GOAL_WIDTH, GROUND_Y - GOAL_HEIGHT, GOAL_WIDTH + 5, GOAL_HEIGHT);
            
            p1.update(); p2.update(); ball.update();
            
            let p1Colliding = false, p2Colliding = false;

            const checkCollide = (p) => {
                const dx = ball.x - p.x, dy = ball.y - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                return dist < p.radius + ball.radius;
            };

            p1Colliding = checkCollide(p1);
            p2Colliding = checkCollide(p2);

            if (p1Colliding && p2Colliding) {
                // COLLIDE POP LOGIC
                ball.vy = -18;
                ball.vx = (Math.random() - 0.5) * 10;
                p1.vx = -15; p2.vx = 15;
            } else {
                [p1, p2].forEach(p => {
                    const dx = ball.x - p.x, dy = ball.y - p.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < p.radius + ball.radius) {
                        const angle = Math.atan2(dy, dx);
                        const force = 14 + Math.abs(p.vx) * 0.6;
                        ball.vx = Math.cos(angle) * force;
                        ball.vy = Math.sin(angle) * force - 3;
                        ball.x = p.x + Math.cos(angle) * (p.radius + ball.radius + 1);
                        ball.y = p.y + Math.sin(angle) * (p.radius + ball.radius + 1);
                    }
                });
            }

            p1.draw(); p2.draw(); ball.draw();
            if (gameRunning) requestAnimationFrame(mainLoop);
        }

        function joinLobby() {
            const input = document.getElementById('user-nick');
            nickname = input.value.trim().toUpperCase();
            if (!nickname || nickname.length < 2) return;
            document.getElementById('nickname-overlay').classList.add('hidden');
            document.getElementById('tournament-menu').classList.remove('hidden');
            document.getElementById('my-nick-display').innerText = `LOGGED IN AS: ${nickname}`;
            
            // Show mobile controls if touch interface is detected
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('mobile-controls').classList.remove('opacity-0');
            }
            
            initTournament();
        }

        function initTournament() {
            bracket = { playoffs: [], r16: [], qf: [], sf: [], final: [] };
            
            // Randomize elite direct qualifiers and playoff contenders
            let elitePool = [...eliteTeams].sort(() => Math.random() - 0.5);
            let playoffPool = [...playoffTeams].sort(() => Math.random() - 0.5);

            // Populate 8 Playoff matchups from the 16 playoff teams
            for (let i = 0; i < 8; i++) {
                bracket.playoffs.push({
                    id: `playoffs-${i}`,
                    p1: playoffPool[i * 2],
                    p2: playoffPool[i * 2 + 1],
                    winner: null
                });
            }

            // Populate Round of 16.
            // p1 is prefilled with an elite direct qualifier.
            // p2 will be filled by the winner of the corresponding playoffs match.
            for (let i = 0; i < 8; i++) {
                bracket.r16.push({
                    id: `r16-${i}`,
                    p1: elitePool[i],
                    p2: null,
                    winner: null
                });
            }

            // Initialize remaining tournament progression phases
            for (let i = 0; i < 4; i++) {
                bracket.qf.push({ id: `qf-${i}`, p1: null, p2: null, winner: null });
            }
            for (let i = 0; i < 2; i++) {
                bracket.sf.push({ id: `sf-${i}`, p1: null, p2: null, winner: null });
            }
            bracket.final.push({ id: `final-0`, p1: null, p2: null, winner: null });

            renderBracket();
        }

        function renderBracket() {
            const rounds = ['playoffs', 'r16', 'qf', 'sf', 'final'];
            rounds.forEach(r => {
                const container = document.getElementById('round-' + r);
                let roundHeaderName = r === 'playoffs' ? 'PLAYOFFS' : r.toUpperCase();
                container.innerHTML = `<h4 class="bungee text-[10px] opacity-40 mb-2 border-b border-white/10 pb-1 text-yellow-500">${roundHeaderName}</h4>`;
                
                bracket[r].forEach(match => {
                    const el = document.createElement('div');
                    el.className = `bracket-match ${activeMatch?.id === match.id ? 'active' : ''}`;
                    
                    const p1Name = match.p1 ? match.p1.name : '???';
                    let p2Name = '???';
                    if (match.p2) {
                        p2Name = match.p2.name;
                    } else if (r === 'r16') {
                        const playOffMatchIndex = parseInt(match.id.split('-')[1]);
                        p2Name = `PLAYOFF ${playOffMatchIndex + 1} WINNER`;
                    }

                    el.innerHTML = `
                        <div class="truncate ${match.winner?.id === match.p1?.id ? 'winner-text' : ''}">${p1Name}</div>
                        <div class="h-px bg-white/10 my-1"></div>
                        <div class="truncate ${match.winner?.id === match.p2?.id ? 'winner-text' : ''}">${p2Name}</div>
                    `;
                    
                    if (!match.winner && match.p1 && match.p2) {
                        el.onclick = () => {
                            activeMatch = match;
                            p1Team = match.p1; p2Team = match.p2;
                            gameTime = ROUND_TIMES[r];
                            document.getElementById('match-duration-display').innerText = gameTime + 's';
                            document.getElementById('prev-p1-logo').src = p1Team.logo;
                            document.getElementById('prev-p1-name').innerText = p1Team.name;
                            document.getElementById('prev-p2-logo').src = p2Team.logo;
                            document.getElementById('prev-p2-name').innerText = p2Team.name;
                            document.getElementById('match-preview').classList.remove('hidden');
                            renderBracket();
                        };
                    }
                    container.appendChild(el);
                });
            });
        }

        function startMatch() {
            document.getElementById('tournament-menu').classList.add('hidden');
            document.getElementById('hud').classList.remove('opacity-0');
            document.getElementById('hud-p1-logo').src = p1Team.logo;
            document.getElementById('hud-p2-logo').src = p2Team.logo;
            score = [0, 0]; isGameOver = false; gameRunning = true;
            document.getElementById('hud-p1-score').innerText = '0';
            document.getElementById('hud-p2-score').innerText = '0';
            p1ActiveIdx = 0; p2ActiveIdx = 0;
            ball.reset(); p1.reset(); p2.reset();
            const timerDisplay = document.getElementById('timer');
            mainLoop();
            const timerInt = setInterval(() => {
                if(!gameRunning) { clearInterval(timerInt); return; }
                if(!isGoalScored) gameTime--;
                const m = Math.floor(gameTime/60), s = gameTime%60;
                timerDisplay.innerText = `${m}:${s<10?'0':''}${s}`;
                if(gameTime <= 0) { clearInterval(timerInt); finishMatch(); }
            }, 1000);
        }

        function finishMatch() {
            gameRunning = false; isGameOver = true;
            if (score[0] === score[1]) score[Math.random() > 0.5 ? 0 : 1]++; 
            const winner = score[0] > score[1] ? p1Team : p2Team;
            
            if (activeMatch) {
                activeMatch.winner = winner;
                const roundType = activeMatch.id.split('-')[0];
                const mIdx = parseInt(activeMatch.id.split('-')[1]);

                if (roundType === 'playoffs') {
                    // Winner of playoffs-k progresses to r16-k's p2 slot
                    bracket.r16[mIdx].p2 = winner;
                } else if (roundType === 'r16') {
                    const target = bracket.qf[Math.floor(mIdx/2)];
                    if (mIdx % 2 === 0) target.p1 = winner; else target.p2 = winner;
                } else if (roundType === 'qf') {
                    const target = bracket.sf[Math.floor(mIdx/2)];
                    if (mIdx % 2 === 0) target.p1 = winner; else target.p2 = winner;
                } else if (roundType === 'sf') {
                    const target = bracket.final[0];
                    if (mIdx % 2 === 0) target.p1 = winner; else target.p2 = winner;
                }
            }
            document.getElementById('result-menu').classList.remove('hidden');
            document.getElementById('winner-display').innerText = `${winner.name.toUpperCase()} VICTORIOUS!`;
        }

        document.getElementById('join-btn').onclick = joinLobby;
        document.getElementById('kickoff-btn').onclick = startMatch;
        document.getElementById('back-to-bracket').onclick = () => {
            document.getElementById('result-menu').classList.add('hidden');
            document.getElementById('hud').classList.add('opacity-0');
            document.getElementById('tournament-menu').classList.remove('hidden');
            document.getElementById('match-preview').classList.add('hidden');
            activeMatch = null; renderBracket();
        };

        const setupTouchControl = (btnId, keyCode) => {
            const btn = document.getElementById(btnId);
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys[keyCode] = true;
            });
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[keyCode] = false;
            });
        };

        setupTouchControl('touch-left', 'KeyA');
        setupTouchControl('touch-right', 'KeyD');
        setupTouchControl('touch-up', 'KeyW');
        setupTouchControl('touch-sub', 'KeyS');

        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        window.onload = () => {
            document.getElementById('user-nick').focus();
            resizeCanvas();
        };
    </script>
</body>
</html>
